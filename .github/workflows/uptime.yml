# Keeps the free-tier API warm (Render sleeps idle services).
# Skipped until the repository variable API_URL is set (Settings, Secrets and variables, Actions, Variables).
name: Uptime ping
on:
  schedule: [{cron: "*/5 * * * *"}]
  workflow_dispatch:
jobs:
  ping:
    if: ${{ vars.API_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - run: curl --fail --max-time 60 "${{ vars.API_URL }}/health"
