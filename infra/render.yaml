# Render blueprint. Secrets are set in the Render dashboard, never here.
services:
  - type: web
    name: baton-api
    runtime: docker
    dockerfilePath: ./infra/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENV
        value: production
      - key: DATABASE_URL
        sync: false          # Supabase connection string (pooler), set in dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false          # your Vercel URL only, e.g. https://baton.vercel.app
      - key: LLM_PROVIDER
        value: replay
